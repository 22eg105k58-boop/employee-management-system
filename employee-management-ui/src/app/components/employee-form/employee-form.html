<h2>Add Employee</h2>

<form (ngSubmit)="addEmployee()">

  <div>
    <label for="name">Name:</label>
    <input
      id="name"
      type="text"
      name="name"
      [(ngModel)]="employee.name"
      required
    />
  </div>

  <div>
    <label for="email">Email:</label>
    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="employee.email"
      required
    />
  </div>

  <div>
    <label for="department">Department:</label>
    <input
      id="department"
      type="text"
      name="department"
      [(ngModel)]="employee.department"
      required
    />
  </div>

  <div>
    <label for="salary">Salary:</label>
    <input
      id="salary"
      type="number"
      name="salary"
      [(ngModel)]="employee.salary"
      required
    />
  </div>

  <button type="submit">
    Add Employee
  </button>

</form>
