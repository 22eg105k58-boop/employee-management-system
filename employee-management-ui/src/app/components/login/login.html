<div class="login-container">

  <div class="login-card">

    <h2>Employee Management System</h2>

    <h3>Login</h3>

    <form (ngSubmit)="login()">

      <div>
        <label>Username</label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          required
        />
      </div>

      <div>
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </div>

      <button type="submit">
        Login
      </button>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

    </form>

  </div>

</div>
